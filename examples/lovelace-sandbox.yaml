# One copy of this section may be added for each HorizonIQ Sandbox entry.
# Replace the example entity IDs with the IDs shown by your Home Assistant instance.
type: vertical-stack
title: HorizonIQ sandbox — <entry-slug>
cards:
  - type: entities
    title: Battery
    entities:
      - sensor.horizoniq_virtual_battery_state_of_charge
      - number.horizoniq_virtual_battery_set_state_of_charge
      - sensor.horizoniq_virtual_battery_energy
      - sensor.horizoniq_virtual_battery_battery_power
      - sensor.horizoniq_virtual_battery_grid_power
      - number.horizoniq_virtual_battery_battery_capacity
      - number.horizoniq_virtual_battery_battery_reserve
      - number.horizoniq_virtual_battery_charge_limit
      - number.horizoniq_virtual_battery_discharge_limit

  - type: entities
    title: Simulation
    entities:
      - switch.horizoniq_virtual_battery_simulation
      - select.horizoniq_virtual_battery_simulation_clock_rate
      - select.horizoniq_virtual_battery_scenario
      - number.horizoniq_virtual_battery_load
      - number.horizoniq_virtual_battery_solar_generation
      - button.horizoniq_virtual_battery_step_simulation
      - button.horizoniq_virtual_battery_reset_simulation
      - button.horizoniq_virtual_battery_save_snapshot
      - sensor.horizoniq_virtual_battery_virtual_time

  - type: entities
    title: Replay
    entities:
      - select.horizoniq_virtual_battery_profile
      - switch.horizoniq_virtual_battery_profile_playback
      - button.horizoniq_virtual_battery_profile_reset
      - sensor.horizoniq_virtual_battery_profile_cursor
      - sensor.horizoniq_virtual_battery_forecast_health
      - sensor.horizoniq_virtual_battery_command_status
      - sensor.horizoniq_virtual_battery_decision

  - type: entities
    title: Fault testing
    entities:
      - select.horizoniq_virtual_battery_fault_kind
      - button.horizoniq_virtual_battery_inject_selected_fault
      - button.horizoniq_virtual_battery_clear_faults
      - sensor.horizoniq_virtual_battery_active_faults
      - sensor.horizoniq_virtual_battery_mqtt_health
      - sensor.horizoniq_virtual_battery_energy_balance_health
      - sensor.horizoniq_virtual_battery_energy_balance_error
